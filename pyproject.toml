[project]
name = "semantic-cache"
version = "0.1.0"
description = "Reuses answers for semantically similar LLM requests to cut cost and latency, with a measured false-hit rate and safe invalidation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
scache = "scache.cli:main"

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scache"]

[tool.ruff]
line-length = 100
